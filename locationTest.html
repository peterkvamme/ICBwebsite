<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ice Cream Boat Location Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="logo-marker.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    #map { cursor: crosshair; }
    .test-instructions {
      margin: 12px 4px 0;
      text-align: center;
      font-size: clamp(.85rem, 2.8vw, 1rem);
      font-weight: 700;
      color: rgba(23,23,23,.68);
    }
    .leaflet-container { background: #cfe8f3; }
    .landmark-pin-icon {
      background: transparent;
      border: 0;
    }
    .landmark-pin {
      position: relative;
      width: 25px;
      height: 25px;
      background: #e53935;
      border: 2px solid #fff;
      border-radius: 50% 50% 50% 0;
      box-shadow: 0 1px 4px rgba(0,0,0,.55);
      transform: rotate(-45deg);
    }
    .landmark-pin::after {
      content: "";
      position: absolute;
      width: 7px;
      height: 7px;
      top: 7px;
      left: 7px;
      background: #fff;
      border-radius: 50%;
    }
    .landmark-label {
      background: rgba(255,255,255,.94);
      border: 1px solid rgba(0,0,0,.3);
      border-radius: 5px;
      box-shadow: 0 1px 3px rgba(0,0,0,.25);
      color: #171717;
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.15;
      padding: 3px 6px;
      white-space: nowrap;
    }
    .landmark-label::before { display: none; }
  </style>
</head>
<body>
  <main class="page public-page">
    <section class="status-card">
      <div class="status-layout">
        <div class="logo-column">
          <img src="logo-header.png" class="status-logo" alt="Ice Cream Boat logo">
        </div>
        <div class="text-column">
          <div class="brand-name">Ice Cream Boat</div>
          <h1 id="headline">Selling Now</h1>
          <div class="location-updated-row">
            <div id="area" class="location-line">Click the map to test a location.</div>
            <div id="updated" class="updated-text"></div>
          </div>
          <div id="note" class="note-line"></div>
          <a id="mapsLink" class="button" target="_blank" rel="noopener" style="display:none">
            Open Selected Location
          </a>
        </div>
      </div>
    </section>

    <section class="map-card">
      <div id="map" aria-label="Clickable Gull Lake location test map"></div>
    </section>

    <p class="test-instructions">Click anywhere on the map. The boat pin and nearest displayed landmark will update immediately.</p>

    <section class="about-section">
      <p>Ice Cream Boat on Gull Lake, MN — location test page</p>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="landmarks.js"></script>
  <script>
    (() => {
      "use strict";

      const landmarks = Array.isArray(window.BOAT_LANDMARKS)
        ? window.BOAT_LANDMARKS
        : [];

      if (!landmarks.length) {
        document.getElementById("area").textContent = "No landmarks found in landmarks.js";
        throw new Error("window.BOAT_LANDMARKS is missing or empty");
      }

      const lakeBounds = L.latLngBounds(
        [46.377, -94.419],
        [46.521, -94.270]
      );

      const map = L.map("map", {
        zoomControl: true,
        maxBounds: lakeBounds.pad(0.35),
        maxBoundsViscosity: 0.65
      });

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
      }).addTo(map);

      map.fitBounds(lakeBounds, { padding: [10, 10] });

      const boatIcon = L.icon({
        iconUrl: "logo-marker.png",
        iconSize: [78, 78],
        iconAnchor: [39, 39],
        popupAnchor: [0, -39]
      });

      const landmarkIcon = L.divIcon({
        className: "landmark-pin-icon",
        html: '<div class="landmark-pin"></div>',
        iconSize: [29, 37],
        iconAnchor: [14, 35]
      });

      landmarks.forEach(landmark => {
        L.marker([landmark.lat, landmark.lng], {
          icon: landmarkIcon,
          interactive: false,
          keyboard: false,
          zIndexOffset: 100
        })
          .addTo(map)
          .bindTooltip(landmark.name, {
            permanent: true,
            direction: "right",
            offset: [11, -17],
            className: "landmark-label",
            opacity: 1
          });
      });

      let boatMarker = null;

      function distanceMeters(aLat, aLng, bLat, bLng) {
        const radius = 6371000;
        const toRadians = value => value * Math.PI / 180;
        const dLat = toRadians(bLat - aLat);
        const dLng = toRadians(bLng - aLng);
        const lat1 = toRadians(aLat);
        const lat2 = toRadians(bLat);
        const h = Math.sin(dLat / 2) ** 2 +
          Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
        return 2 * radius * Math.asin(Math.sqrt(h));
      }

      function nearestLandmark(lat, lng) {
        return landmarks.reduce((nearest, landmark) => {
          const meters = distanceMeters(lat, lng, landmark.lat, landmark.lng);
          return !nearest || meters < nearest.meters
            ? { ...landmark, meters }
            : nearest;
        }, null);
      }

      function mapsUrl(lat, lng) {
        const label = encodeURIComponent("Ice Cream Boat test location");
        if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
          return `https://maps.apple.com/?q=${label}&ll=${lat},${lng}`;
        }
        return `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
      }

      function selectLocation(lat, lng) {
        const nearest = nearestLandmark(lat, lng);
        const position = [lat, lng];

        if (!boatMarker) {
          boatMarker = L.marker(position, { icon: boatIcon }).addTo(map);
        } else {
          boatMarker.setLatLng(position);
        }

        boatMarker
          .bindPopup(`<strong>Ice Cream Boat</strong><br>${nearest.label}`)
          .openPopup();

        document.getElementById("headline").textContent = "Selling Now";
        document.getElementById("area").textContent = `📍 ${nearest.label}`;
        document.getElementById("updated").textContent = "Updated just now";
        document.getElementById("note").textContent = "";

        const mapsLink = document.getElementById("mapsLink");
        mapsLink.href = mapsUrl(lat, lng);
        mapsLink.style.display = "flex";
      }

      map.on("click", event => {
        selectLocation(event.latlng.lat, event.latlng.lng);
      });

      window.addEventListener("load", () => {
        setTimeout(() => map.invalidateSize(), 100);
      });
    })();
  </script>
</body>
</html>
